# Port 80 — redirect everything to HTTPS. CF terminates TLS at the edge
# but also connects to origin; either path benefits from origin-side
# HTTPS so we go end-to-end TLS (CF SSL mode = Full/Full Strict).
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name race-overlay.com www.race-overlay.com api.race-overlay.com _;

    ssl_certificate     /etc/letsencrypt/live/race-overlay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/race-overlay.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Allow large video uploads through to /api/.
    client_max_body_size 4G;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy the export API to the backend container.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long jobs + large uploads need generous timeouts and disabled buffering.
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      30m;
        proxy_send_timeout      30m;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
